name: mobile_template
description: "Not Spent — mindful impulse savings, goals and scenario projections."
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ^3.9.2

dependencies:
  go_router: ^16.2.0
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.9
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^9.2.4
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  fpdart: ^1.1.1
  get_it: ^8.2.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  package_info_plus: ^9.0.0
  retrofit: ^4.7.2
  shared_preferences: ^2.5.3
  web: ^1.1.1
dev_dependencies:
  build_runner: ^2.15.0
  flutter_gen_runner: 5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  retrofit_generator: ^10.0.5

flutter_gen:
  output: lib/generated/
  line_length: 80
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/env/
    - assets/legal/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#F3EFE7"
    theme_color: "#272D34"
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#272D34"
  adaptive_icon_foreground: assets/images/app_icon.png
